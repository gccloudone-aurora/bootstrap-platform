apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-to-csp-metadata-from-ns
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
      - key: k8s:kubernetes.azure.com/managedby
        operator: DoesNotExist
  egress:
    - toCIDR:
        - 169.254.169.252/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "988"
              protocol: TCP
    - toCIDR:
        - 169.254.169.254/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
