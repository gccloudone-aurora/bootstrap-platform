{{- if .Values.clusterwideNetworkPolicies.metadata }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-to-csp-metadata-from-ns
spec:
  endpointSelector:
    matchExpressions:
      # Shared: allow metadata egress from all namespaces except kube-system.
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  egress:
    # Shared: cloud instance metadata service (IMDS) on AWS/Azure/GCP.
    - toCIDR:
        - 169.254.169.254/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- if eq .Values.k8sProvider "aws" }}
    # AWS-specific: EKS Pod Identity Agent (link-local). Cilium may classify this as host.
    - toCIDR:
        - 169.254.170.23/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- end }}
{{- if or (eq .Values.k8sProvider "azure") (eq .Values.k8sProvider "gcp") }}
    # Azure/GCP-specific: additional link-local metadata endpoint.
    - toCIDR:
        - 169.254.169.252/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "988"
              protocol: TCP
{{- end }}
{{- end }}
