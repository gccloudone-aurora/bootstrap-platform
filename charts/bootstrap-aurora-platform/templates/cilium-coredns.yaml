{{- if .Values.clusterwideNetworkPolicies.coreDns }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-to-coredns-from-ns
spec:
  endpointSelector:
    matchExpressions:
      # Shared: allow DNS egress from all namespaces except kube-system.
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
{{- if eq .Values.k8sProvider "gcp" }}
      # GKE-specific: exclude addon-manager namespaces.
      - key: k8s:io.cilium.k8s.namespace.labels.addonmanager.kubernetes.io/mode
        operator: DoesNotExist
{{- end }}
  egress:
    - toEndpoints:
        # Shared: CoreDNS on EKS/AKS/GKE uses the kube-dns label.
        - matchLabels:
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
{{- if eq .Values.k8sProvider "gcp" }}
        # GKE NodeLocal DNSCache.
        - matchLabels:
            k8s:k8s-app: node-local-dns
            k8s:io.kubernetes.pod.namespace: kube-system
{{- end }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
