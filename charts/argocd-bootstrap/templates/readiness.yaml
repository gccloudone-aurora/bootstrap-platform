{{- if eq .Values.phase "readiness" }}
{{- $name := printf "%s-wait" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ add (mul 2 (int .Values.readiness.timeoutSeconds)) 60 }}
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-crd-creation
          image: {{ .Values.readiness.image | quote }}
          command: [kubectl]
          args:
            - wait
            - --for=create
            - {{ printf "--timeout=%ds" (int .Values.readiness.timeoutSeconds) | quote }}
            - crd/appprojects.argoproj.io
            - crd/applicationsets.argoproj.io
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: wait-for-crd-readiness
          image: {{ .Values.readiness.image | quote }}
          command: [kubectl]
          args:
            - wait
            - --for=condition=Established
            - {{ printf "--timeout=%ds" (int .Values.readiness.timeoutSeconds) | quote }}
            - crd/appprojects.argoproj.io
            - crd/applicationsets.argoproj.io
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: cache
          emptyDir: {}
{{- end }}
