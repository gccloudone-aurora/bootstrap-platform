{{- if .Values.clusterwideNetworkPolicies.awsMetadata }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-to-aws-metadata-from-ns
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  egress:
    # EC2 Instance Metadata Service (IMDS)
    - toCIDR:
        - 169.254.169.254/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # EKS Pod Identity Agent (link-local). Cilium may classify this as host.
    - toCIDR:
        - 169.254.170.23/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- end }}
